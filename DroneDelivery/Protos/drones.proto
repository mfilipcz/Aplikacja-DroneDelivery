syntax = "proto3";

option csharp_namespace = "DroneServer";

package drones;

service DroneService {
  // Logowanie (sprawdza w bazie)
  rpc Login (LoginRequest) returns (LoginResponse);
  
  // NOWE: Rejestracja użytkownika (zakładanie konta)
  rpc RegisterUser (RegisterUserRequest) returns (RegisterUserResponse);

  // Dla Admina
  rpc GetAllOrders (Empty) returns (OrderList);
  rpc UpdateOrderStatus (StatusRequest) returns (ServerResponse);

  // Operacje na paczkach
  rpc GetOrders (ClientRequest) returns (OrderList);
  rpc AddOrder (DroneOrderMsg) returns (ServerResponse);
  rpc UpdateOrder (DroneOrderMsg) returns (ServerResponse);
  rpc DeleteOrder (DeleteRequest) returns (ServerResponse);
  
  // Stare (dla kompatybilności wstecznej, można zostawić)
  rpc RegisterClient (ClientInfo) returns (RegisterResponse);
}

message Empty {}

// --- NOWE STRUKTURY ---
message RegisterUserRequest {
  string username = 1;
  string password = 2;
}

message RegisterUserResponse {
  bool success = 1;
  string message = 2;
}
// ----------------------

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string role = 2;     
  string clientId = 3; 
  string message = 4;
}

message StatusRequest {
  string orderId = 1;
  string newStatus = 2;
  bool isAdmin = 3;
}

message ClientInfo { string platform = 1; }
message RegisterResponse { bool success = 1; string clientId = 2; }
message ClientRequest { string clientId = 1; }
message DeleteRequest { string id = 1; string clientId = 2; }
message ServerResponse { bool success = 1; string message = 2; }
message OrderList { repeated DroneOrderMsg orders = 1; }

message DroneOrderMsg {
  string id = 1;
  string originAddress = 2;
  double originLat = 3;
  double originLng = 4;
  string destinationAddress = 5;
  double destLat = 6;
  double destLng = 7;
  double packageWeightKg = 8;
  string status = 9;
  double progress = 10;
  bool isIncoming = 11;
  string sendDate = 12;
  string deliveryDate = 13;
  double currentLat = 14;
  double currentLng = 15;
  string clientId = 16;
}