<?xml version="1.0" encoding="utf-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Tło - kółko -->
  <circle cx="24" cy="24" r="22" fill="#3B82F6"/>
  <circle cx="24" cy="24" r="20" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  
  <!-- Korpus drona -->
  <ellipse cx="24" cy="24" rx="6" ry="4" fill="#1E3A8A"/>
  
  <!-- Ramiona -->
  <line x1="18" y1="18" x2="10" y2="10" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="18" x2="38" y2="10" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="30" x2="10" y2="38" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="30" x2="38" y2="38" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Śmigła (kółka) -->
  <circle cx="10" cy="10" r="5" fill="#3B82F6" opacity="0.8"/>
  <circle cx="38" cy="10" r="5" fill="#3B82F6" opacity="0.8"/>
  <circle cx="10" cy="38" r="5" fill="#3B82F6" opacity="0.8"/>
  <circle cx="38" cy="38" r="5" fill="#3B82F6" opacity="0.8"/>
  
  <!-- Środkowe kółko (kamera) -->
  <circle cx="24" cy="24" r="3" fill="#1E3A8A"/>
</svg>
